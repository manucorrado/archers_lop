<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas de mejoras · Nogal y latón</title><link href="nogal.css" rel="stylesheet">
<script defer src="../lino/data.js"></script><script defer src="nogal.js"></script></head>
<body><main>
 <header><button id="collection" type="button"><img src="../../../assets/atlas_arco.svg" alt=""><span data-word="collection"></span></button><h1 data-word="title"></h1>
  <div class="wallet"><svg viewBox="0 0 20 24" aria-hidden="true"><path d="M10 2C8 9 3 12 3 16a7 6 0 1 0 14 0c0-4-5-8-7-14Z"/><path d="M7 16q0 3 3 3"/></svg><b id="sap"></b><span data-word="sap"></span></div><button id="lang" class="link"></button>
 </header>
 <section id="surface">
  <i class="pin tl"></i><i class="pin tr"></i><i class="pin bl"></i><i class="pin br"></i>
  <aside class="legend"><h2 data-word="states"></h2><ul id="legend"></ul><span id="levels"></span></aside>
  <svg id="map" role="group"><defs>
   <linearGradient id="metal" x1="0" x2=".85" y1="0" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#ffdfa9"/><stop offset=".45" stop-color="#d9b880"/><stop offset="1" stop-color="#b29662"/></linearGradient>
   <linearGradient id="brass" x1="0" x2="1" y1="0" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#a4824e"/><stop offset=".4" stop-color="#ead09d"/><stop offset="1" stop-color="#af8c55"/></linearGradient>
  </defs><g id="routes"></g><g id="pieces"></g></svg>
  <aside id="tip" role="tooltip" hidden><div id="status"></div><h3 id="name"></h3><p id="effect"></p><div id="price"></div></aside>
 </section>
 <footer><a href="../index.html" data-word="back"></a><button class="link reset" id="reset" data-word="reset"></button><div class="zoom"><button id="minus">−</button><button id="fit"></button><button id="plus">+</button></div></footer>
</main>
<dialog id="drawing"><button id="close" class="link"></button><img src="../../../assets/atlas_arco.svg" alt=""><h2 data-word="drawing"></h2></dialog>
</body></html>
