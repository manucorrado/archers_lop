<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Atlas de mejoras · Lino y tinta</title>
  <link rel="stylesheet" href="lino.css">
</head>
<body>
  <main>
    <header>
      <div class="identity">
        <img src="../../../assets/atlas_arco.svg" alt="">
        <h1 data-es="Atlas de mejoras" data-en="Upgrade atlas">Atlas de mejoras</h1>
      </div>
      <div class="balance"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C10 7 5 11 5 15a7 7 0 0 0 14 0c0-4-5-8-7-13Z"/><path d="M9 15q0 3 3 3"/></svg><span id="wallet" aria-live="polite">850</span> <span data-es="savia" data-en="sap">savia</span></div>
      <button id="lang" type="button">English</button>
    </header>
    <section class="paper" aria-label="Atlas">
      <div class="legend">
        <div class="legendTitle" data-es="Estado de las mejoras" data-en="Upgrade status">Estado de las mejoras</div>
        <ul>
          <li><i class="key virgin">+</i><span data-es="Sin comprar" data-en="Unpurchased">Sin comprar</span></li>
          <li><i class="key progress">◒</i><span data-es="En progreso" data-en="In progress">En progreso</span></li>
          <li><i class="key full">✓</i><span data-es="Completa" data-en="Complete">Completa</span></li>
        </ul>
        <p id="rankTotal"></p>
      </div>
      <div id="map" aria-label="Mapa de mejoras">
        <svg id="edges" aria-hidden="true"></svg>
        <div id="nodes"></div>
      </div>
      <div id="note" role="tooltip" hidden><div id="noteStatus"></div><h2 id="noteName"></h2><p id="noteBody"></p><div id="noteBuy"></div></div>
    </section>
    <footer>
      <a href="../index.html" data-es="← Volver a las opciones" data-en="← Back to studies">← Volver a las opciones</a>
      <div class="footRight"><button id="reset" data-es="Reiniciar prueba" data-en="Reset study">Reiniciar prueba</button>
      <div class="zoom"><button id="less" aria-label="Alejar">−</button><button id="homeZoom" aria-label="Centrar mapa">100 %</button><button id="more" aria-label="Acercar">+</button></div></div>
    </footer>
  </main>
  <script src="data.js"></script><script src="lino.js"></script>
</body>
</html>
